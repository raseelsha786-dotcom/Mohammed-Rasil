<style>
/* VOICE: a calm, exact landlord's ledger for four Ajman buildings — fast on a phone.
   IDEA: a rent book: one deep-blue cover band, white ledger pages, magenta for money owed.
   PICTURE: the working tool itself — building tabs, live numbers, lists you tap to edit.
   COLOUR and TYPE: oxford blue band, white panels, magenta accent; Red Hat Display + Text.
   LAYOUT: band with buildings + sections, then figures, then the list; stacks on phones. */
:root{color-scheme:light dark;--bg:light-dark(#eef1f8,#070f26);--panel:light-dark(#fff,#0f1a3a);--ink:light-dark(#0b1f4b,#e6ebf7);--mute:light-dark(#5b6785,#9aa6c4);--line:light-dark(#dde3ef,#22305a);--band:#0b1f4b;--acc:#e0115f;--ok:light-dark(#137a46,#4cd38a);--warn:light-dark(#9a5500,#ffb547);--bad:light-dark(#c8102e,#ff6b81);--okb:light-dark(#e3f5ec,#123526);--warnb:light-dark(#fff1dc,#3a2a10);--badb:light-dark(#fde6ea,#3d1420);--soft:light-dark(#f5f7fc,#0b1430)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Red Hat Display",sans-serif;margin:0;line-height:1.1;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.band{background:var(--band);color:#fff;padding:18px max(4vw,14px) 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1240px;margin:auto}
.top h1{font-size:clamp(24px,4vw,34px);font-weight:800}
.top small{display:block;color:#aab6d6;font-size:13px}
.conn{font-size:13px;color:#cdd6ee;display:flex;align-items:center;gap:6px}
.conn i{width:9px;height:9px;border-radius:50%;background:#7c88a8;display:inline-block}
.conn.ok i{background:#4cd38a}.conn:not(.ok):not(.err) i{background:#ffb547}.conn.err i{background:var(--acc)}
.chips,.tabs{display:flex;gap:8px;overflow-x:auto;max-width:1240px;margin:14px auto 0;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid #3b4f86;background:transparent;color:#fff;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:#fff;color:var(--band);border-color:#fff}
.tabs{margin-top:12px}
.tabs button{flex:none;min-height:46px;padding:0 14px;border:0;background:none;color:#aab6d6;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:#fff;border-color:var(--acc)}
.wrap{max-width:1240px;margin:auto;padding:16px max(4vw,14px) 90px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 12px;font-size:16px}
#q{flex:1 1 220px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{font-size:13px;color:var(--mute);display:block}
.kpi b{font:800 clamp(22px,3.2vw,32px)/1.1 "Red Hat Display",sans-serif;display:block;margin:4px 0;white-space:nowrap}
.kpi em{font-style:normal;font-size:13px;color:var(--mute)}
.kpi.money b{color:var(--acc)}
.kpi.tap{cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
.kpi.tap:after{content:'Tap for list ›';display:block;margin-top:8px;font-size:12px;font-weight:700;color:var(--acc)}
.kpi.tap.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.kpi.tap.on:after{content:'Showing list ▾'}
.kdh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kds{font-size:15px;margin:18px 0 6px;padding:6px 10px;border-radius:8px;background:#f3f4f8}
.tdhead h1{font:800 22px/1.2 "Red Hat Display",sans-serif;margin:0}.tdhead{margin:2px 0 12px}
a.kpi{text-decoration:none;color:inherit;display:block}.okc{color:#1f7a3d}
.tdb h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tdb h2 .cnt{background:#eef0f6;border-radius:99px;padding:1px 9px;font-size:14px}.tdb h2 .amt{margin-left:auto;font-size:15px}
.tdb.bad{border-left:4px solid #c8325a}.tdb.warn{border-left:4px solid #e0a106}.tdb.ok{border-left:4px solid #2e8b57}
.bdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle;flex:none}
.chips button{border-color:var(--bc,#3b4f86)}.chips button[aria-pressed=true]{background:var(--bc);color:#fff;border-color:var(--bc)}.chips button[data-bsel=all][aria-pressed=true]{color:var(--band)}.chips button[aria-pressed=true] .bdot{background:#fff!important}
.tabs button[aria-selected=true]{border-color:var(--tc,var(--acc))!important}.tabs button:hover{color:var(--tc,#fff)}
.bcard{border-top:6px solid var(--bc)!important;background:color-mix(in srgb,var(--bc) 4%,#fff)}.bcard>.bh h2{color:var(--bc)}.rooms[style] .room{border-top:4px solid var(--bc)}.rooms[style] .room .rk tr:first-child td{color:var(--bc);font-weight:700}.bcard .bstats div{background:color-mix(in srgb,var(--bc) 9%,#fff)}
tr.brow td:first-child{border-left:4px solid var(--bc)}
.tdb{border-left:5px solid var(--tc)!important}.tdb h2{color:var(--tc)}.tdb h2 .cnt{background:var(--tc);color:#fff}
.kpi[style*="--tc"]{border-top:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 6%,#fff)}.kpi[style*="--tc"] span{color:var(--tc);font-weight:700}
.kl{list-style:none;margin:0;padding:0}.kl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}.kl li .n{text-align:right;white-space:nowrap;font-weight:700}.kl li .sub{font-weight:400}
.kds.ok{background:#e8f5ec}.kds.warn{background:#fff6e0}.kds.bad{background:#fdeaee}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2{font-size:20px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okb);color:var(--ok)}.t-warn{background:var(--warnb);color:var(--warn)}.t-bad{background:var(--badb);color:var(--bad)}.t-mute{background:var(--soft);color:var(--mute)}
.sub{color:var(--mute);font-size:13px}
.alerts li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.alerts{list-style:none;margin:0;padding:0}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty .btn{margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(5,10,30,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px;z-index:9}
.ov.on{display:flex}
.rbody{padding:12px;display:flex;flex-direction:column;gap:12px}.rbody .card{margin:0}.rbody h3{margin:0 0 10px}
.pps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pp{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;cursor:pointer;font:inherit;color:inherit;min-height:64px}.pp b{font-size:15px}.pp span{font-size:12.5px;color:var(--mute)}.pp.pri{grid-column:1/-1;background:#e8f2fa;border-color:#428ab8}.pp.warn{border-color:#e0a33a;background:#fff6e5}.pp.bad{border-color:#c5283d;background:#fdecee}
body{padding-top:env(safe-area-inset-top)}body::before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--band,#0b1f4a);z-index:50}
.rg .tag{white-space:normal;display:inline-block;margin-top:4px;max-width:100%}
.bcard{margin-top:6px}.bh{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}.bh h2{margin:0 0 2px}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.bstats div{background:var(--bg);border-radius:10px;padding:8px 10px}.bstats b{display:block;font:800 18px/1.2 "Red Hat Display",sans-serif}.bstats span{font-size:12px;color:var(--mute)}.bstats .bal b{color:var(--bad,#c5283d)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin:12px 0 22px}
.room{background:var(--panel);border:1px solid var(--line);border-left:5px solid #2f8f5b;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.room.due{border-left-color:#c5283d}.room.vac{border-left-color:#9aa3b2;opacity:.92}
.rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rh b{font:800 20px/1 "Red Hat Display",sans-serif}.rh .tag{margin-left:auto}
.rt{font-size:14px;line-height:1.45}.rt a{color:inherit}.bad-t{color:#c5283d;font-weight:600}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.rg>div{background:var(--bg);border-radius:9px;padding:7px 9px;min-width:0}.rg span{display:block;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}.rg b{display:block;font-size:15px;margin:1px 0}.rg em{display:block;font-style:normal;font-size:12px;color:var(--mute);line-height:1.35;overflow-wrap:anywhere}.rg .bal b{color:#c5283d}
.tk{font-size:13px;background:#fff6e5;color:#7a4b00;border-radius:9px;padding:7px 9px}.tk a{color:inherit;text-decoration:underline;cursor:pointer}
.ra{display:flex;flex-wrap:wrap;gap:6px}
.rk{width:100%;border-collapse:collapse;font-size:14px}.rk th{width:38%;text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;padding:7px 8px 7px 0;vertical-align:top;border-bottom:1px solid var(--line)}.rk td{padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.rk tr:last-child th,.rk tr:last-child td{border-bottom:0}.rk .big{font:800 20px/1 "Red Hat Display",sans-serif}.rk tr.bal td b{color:#c5283d}.rk tr.warn td{color:#7a4b00}.rk a{color:inherit;cursor:pointer}.rk .btn{min-height:34px;font-size:13px;padding:0 10px;margin:2px 0}.ra .btn{min-height:36px;font-size:13px;padding:0 10px}
@media(max-width:600px){.rooms{grid-template-columns:1fr}}
.ov.doc{padding:0;align-items:stretch}.ov.doc .modal{width:min(900px,100%);border-radius:0;padding:0;display:flex;flex-direction:column;min-height:100%;background:#dfe4ec}
.dvtop{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--band);color:#fff}.dvtop b{flex:1;font:700 16px/1.2 "Red Hat Display",sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dvtop .x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.dvpage{flex:1;padding:12px;overflow:hidden}.pgwrap{margin:0 auto}.page{width:794px;transform-origin:0 0;background:#fff;box-shadow:0 4px 18px rgba(10,20,50,.22);border-radius:3px}
.dvbar{position:sticky;bottom:0;z-index:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08)}.dvbar .btn{padding:0 8px;font-size:14px;min-height:46px;display:flex;align-items:center;justify-content:center;text-decoration:none}.dvbar .big{grid-column:1/-1;font-size:16px;min-height:50px}.dvbar [data-sign],.dvbar [data-charge]{grid-column:1/-1}
.modal{background:var(--panel);border-radius:16px;width:min(760px,100%);padding:20px}
.modal h2{font-size:24px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;font-size:16px}
.fld.wide{grid-column:1/-1}.fld textarea{min-height:70px}
.sec{grid-column:1/-1;font:700 15px "Red Hat Display",sans-serif;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.acts .sp{flex:1}
.hist{margin-top:18px}
.docb{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}.docb .btn{min-height:40px;padding:0 12px;font-size:14px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.mini{min-height:36px!important;padding:0 10px!important;font-size:13px!important}
.alerts li .sp{flex:1}.alerts li{display:grid!important;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'tag btn' 'txt btn';gap:6px 12px;align-items:center}.alerts li>.tag{grid-area:tag;justify-self:start}.alerts li>span:not(.tag):not(.sp){grid-area:txt;min-width:0;overflow-wrap:anywhere;line-height:1.4}.alerts li .sp{display:none}.alerts li>a,.alerts li>button{grid-area:btn;align-self:center}

#toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));bottom:auto;transform:translateX(-50%);background:var(--band);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw}

@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:13px}.stack td:empty{display:none}}
</style>

<header class="band">

const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
// Property records use the UAE calendar. Keep date-only values compatible with D and iso.
const uaeCalendar=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Dubai',year:'numeric',month:'2-digit',day:'2-digit'});
const uaeToday=(now=new Date())=>uaeCalendar.format(now);
const todayDate=()=>D(uaeToday());
let db=null,canWrite=true,bsel='all',tab='home',q='',month=uaeToday().slice(0,7),online=false;
const LK='mrc-sb-data-v1',OK='mrc-sb-outbox-v1';
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let outbox=ls.get(OK,[]);
Object.assign(S,ls.get(LK,{}));Object.keys(SCH).forEach(c=>{if(!Array.isArray(S[c]))S[c]=[]});
const newId=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const applyOp=o=>{const L=S[o.c].filter(x=>x.id!==o.id);if(o.op==='set')L.push({id:o.id,...o.data});S[o.c]=L};
const save=()=>{ls.set(LK,S);ls.set(OK,outbox)};
const D=s=>s?new Date(s+'T00:00:00'):null;
const days=s=>{if(!s)return null;return Math.round((D(s)-todayDate())/864e5)};
const fmt=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fd=s=>s?D(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}):'';
const by=(c,id)=>S[c].find(x=>x.id===id);
const bcode=id=>by('buildings',id)?.code||'?';
const ulab=u=>u?bcode(u.bld)+'-'+u.no:'—';
const tname=id=>by('tenants',id)?.name||'—';
const ast=a=>{if(a.closed==='Yes')return'Closed';const e=days(a.end),s=days(a.start);if(e!=null&&e<0)return'Expired';if(s!=null&&s>0)return'Upcoming';if(e!=null&&e<=30)return'Expiring';return'Active'};
const live=a=>['Active','Expiring','Expired'].includes(ast(a));
const uagr=u=>S.agreements.find(a=>a.unit===u.id&&live(a));
const abld=a=>by('units',a.unit)?.bld;
const pbld=p=>{const a=by('agreements',p.agr);return a?abld(a):null};
const inB=b=>bsel==='all'||b===bsel;
const inM=s=>!!s&&s.slice(0,7)===month;
const tag=(t,k)=>`<span class="tag t-${k}">${esc(t)}</span>`;
const stTag=s=>tag(s,{Active:'ok',Expiring:'warn',Expired:'bad',Upcoming:'mute',Closed:'mute',Occupied:'ok',Vacant:'bad'}[s]||'mute');
const nextId=(c,k,p)=>p+String(Math.max(0,...S[c].map(x=>+String(x[k]||'').replace(/\D/g,'')||0))+1).padStart(4,'0');
const hit=o=>!q||JSON.stringify(o).toLowerCase().includes(q);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)};
const setConn=(k,m)=>{const c=$('#conn');c.className='conn '+k;c.querySelector('span').textContent=m};
const status=()=>{const n=outbox.length;if(online&&navigator.onLine!==false)setConn(n?'':'ok',n?'Syncing '+n+' change'+(n>1?'s':'')+'…':'Online · synced');else setConn('err','Offline · '+(n?n+' change'+(n>1?'s':'')+' waiting to sync':'working from this phone'))};
const urank=n=>/^G\d/i.test(n)?0:/^\d/.test(n)?1:/^shop/i.test(n)?3:2;
const sortU=(a,b)=>bcode(a.bld).localeCompare(bcode(b.bld))||urank(a.no||'')-urank(b.no||'')||(a.no||'').localeCompare(b.no||'',undefined,{numeric:true});
